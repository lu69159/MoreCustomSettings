name: Bug report
description: An issue with the mod.
labels: ["bug"]

body:
  - type: input
    id: version
    attributes:
      label: Mindustry version & mod version
      description: Which version of the mod are you using, and on which version of Mindustry are you running it?
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: Explain your issue in detail.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Steps to reproduce the issue.
    validations:
      required: true
      
  - type: textarea
    id: mods
    attributes:
      label: Other used mods
      description: Other mods used alongside this mod when the issue occurred.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: (Crash) logs
      description: Either crash reports from the crash folder, or the file you get when you go into Settings -> Game Data -> Export Crash logs.
    validations:
      required: false